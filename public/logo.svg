<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="模桥">
  <title>模桥</title>
  <defs>
    <linearGradient id="mq-grad" x1="0" y1="0" x2="64" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5b9dff"/>
      <stop offset="1" stop-color="#8654ff"/>
    </linearGradient>
  </defs>

  <!-- 拱桥主体：渐变弧线 -->
  <path d="M 12 46 Q 32 12 52 46"
        stroke="url(#mq-grad)"
        stroke-width="4"
        stroke-linecap="round"
        fill="none"/>

  <!-- 左/右锚点：代表两端模型/服务 -->
  <circle cx="12" cy="46" r="5.5" fill="#5b9dff"/>
  <circle cx="52" cy="46" r="5.5" fill="#8654ff"/>

  <!-- 桥顶 keystone：强调"桥"的中心节点 -->
  <circle cx="32" cy="20" r="3" fill="#8654ff"/>
</svg>
