<svg viewBox="0 0 320 80" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="aihubmax">
  <title>aihubmax</title>

  <!-- 图标：1 中心 + 3 外围节点，与 logo.svg 一致 -->
  <g transform="translate(8 8) scale(1)">
    <g stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round">
      <line x1="32" y1="32" x2="32" y2="12"/>
      <line x1="32" y1="32" x2="14.7" y2="42"/>
      <line x1="32" y1="32" x2="49.3" y2="42"/>
    </g>
    <g fill="#64748B">
      <circle cx="32" cy="12" r="4"/>
      <circle cx="14.7" cy="42" r="4"/>
      <circle cx="49.3" cy="42" r="4"/>
    </g>
    <circle cx="32" cy="32" r="7.5" fill="#4F46E5"/>
    <circle cx="32" cy="32" r="3" fill="#E0E7FF"/>
  </g>

  <!-- 字标：同字号但 "max" 用主色做重点 -->
  <text x="88" y="52"
        font-family="'Inter', 'SF Pro Display', -apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-size="32" font-weight="600" letter-spacing="-0.5">
    <tspan fill="#0F172A">aihub</tspan><tspan fill="#4F46E5">max</tspan>
  </text>
</svg>
