<svg viewBox="0 0 240 80" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="模桥">
  <title>模桥</title>
  <defs>
    <linearGradient id="mq-full-grad" x1="0" y1="0" x2="64" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5b9dff"/>
      <stop offset="1" stop-color="#8654ff"/>
    </linearGradient>
  </defs>

  <!-- 桥形图标 -->
  <g transform="translate(8 8)">
    <path d="M 12 46 Q 32 12 52 46"
          stroke="url(#mq-full-grad)"
          stroke-width="4"
          stroke-linecap="round"
          fill="none"/>
    <circle cx="12" cy="46" r="5.5" fill="#5b9dff"/>
    <circle cx="52" cy="46" r="5.5" fill="#8654ff"/>
    <circle cx="32" cy="20" r="3" fill="#8654ff"/>
  </g>

  <!-- 字标"模桥" -->
  <text x="92" y="54"
        font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', -apple-system, sans-serif"
        font-size="34" font-weight="600" letter-spacing="2"
        fill="#0F172A">模桥</text>
</svg>
